<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #232323; color: #d6d6d6;
    font: 11px -apple-system, "Segoe UI", sans-serif; user-select: none; }
  ::-webkit-scrollbar { display: none; }
  body { display: flex; flex-direction: column; justify-content: center; }
  .wrap { display: flex; align-items: center; gap: 8px; padding: 6px 8px; min-width: 0; }
  .info { flex: 1; min-width: 0; line-height: 1.25; }
  .name, .ratio { color: #8e8e8e; font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dims { font-size: 11px; font-weight: 600; letter-spacing: -.1px; color: #f0f0f0; white-space: nowrap; }
  .btns { display: flex; gap: 4px; flex-shrink: 0; }
  button { width: 28px; height: 28px; padding: 0; border-radius: 6px; border: 1px solid #3c3c3c;
    background: #2f2f2f; color: #e8e8e8; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
  button:hover:not(:disabled) { background: #3a3a3a; border-color: #2d8ceb; }
  button:active:not(:disabled) { background: #2d8ceb; }
  button:disabled { opacity: .35; cursor: default; }
  button svg { width: 15px; height: 15px; transition: transform .25s; }
  #rotate.spin svg { transform: rotate(90deg); }
  #fill.spin svg { transform: scale(1.2); }
  .msg.ok { color: #7fbf7f; }
  .msg { padding: 0 8px 4px; color: #e8a33d; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg:empty { display: none; }

  /* Layout classes are set by main.js from the panel's real size */
  .stack .wrap { flex-direction: column; align-items: flex-start; gap: 5px; text-align: left; }
  .stack .info { flex: none; width: 100%; }
  .stack .name { display: none; }
  .narrow .orient { display: none; }
  .short .name, .short .ratio { display: none; }
  .tiny .wrap, .slim .wrap { padding: 2px 6px; } .slim button { width: 24px; height: 24px; } .slim button svg { width: 13px; height: 13px; }
  .tiny .wrap { padding: 2px 6px; } .tiny button { width: 24px; height: 24px; } .tiny button svg { width: 13px; height: 13px; }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="btns">
      <button id="rotate" title="Rotate sequence (swap width and height)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
      <button id="fill" title="Fill to frame: scale every video clip to cover the frame" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 9 4 4 9 4"/><polyline points="15 4 20 4 20 9"/><polyline points="20 15 20 20 15 20"/><polyline points="9 20 4 20 4 15"/>
          <rect x="8.5" y="8.5" width="7" height="7" rx="1"/>
        </svg>
      </button>
    </div>
    <div class="info" id="info">
      <div class="name" id="name">-</div>
      <div class="dims" id="dims">-</div>
      <div class="ratio"><span id="ratio"></span><span class="orient" id="orient"></span></div>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <script src="main.js"></script>
</body>
</html>
